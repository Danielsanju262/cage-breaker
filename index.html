<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Break Your Cage</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html {
      scroll-behavior: smooth
    }

    body {
      background: #0a0e1a;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      color: #e2dad0;
      min-height: 100vh;
      line-height: 1.6
    }

    ::selection {
      background: rgba(245, 158, 11, 0.35);
      color: #fff
    }

    #app {
      max-width: 620px;
      margin: 0 auto;
      padding: 36px 20px 80px;
      min-height: 100vh
    }

    .fade {
      animation: fadeIn .45s ease
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    @keyframes breathK {

      0%,
      100% {
        transform: scale(.75);
        opacity: .2
      }

      50% {
        transform: scale(1.2);
        opacity: .6
      }
    }

    @keyframes glowK {

      0%,
      100% {
        box-shadow: 0 0 15px rgba(245, 158, 11, .15)
      }

      50% {
        box-shadow: 0 0 35px rgba(245, 158, 11, .35)
      }
    }

    h1 {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 36px;
      font-weight: normal;
      color: #f9fafb;
      line-height: 1.2;
      letter-spacing: -.4px
    }

    h2 {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 26px;
      font-weight: normal;
      color: #f9fafb;
      line-height: 1.25;
      margin-bottom: 6px
    }

    h3 {
      font-size: 16px;
      font-weight: 600;
      color: #f3f4f6
    }

    .sn {
      font-size: 11px;
      font-weight: 700;
      color: #f59e0b;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 10px
    }

    .d {
      font-size: 15px;
      line-height: 1.7;
      color: #d1d5db;
      margin-bottom: 14px
    }

    .h {
      font-size: 13px;
      color: #9ca3af;
      margin-bottom: 12px;
      line-height: 1.5
    }

    .sm {
      font-size: 12px;
      color: #9ca3af
    }

    .lb {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #e5e7eb;
      margin-bottom: 8px
    }

    input[type="text"],
    input[type="number"],
    textarea {
      width: 100%;
      background: rgba(255, 255, 255, .06);
      border: 1px solid #2e364f;
      border-radius: 8px;
      padding: 13px 14px;
      font-size: 15px;
      color: #f9fafb;
      font-family: inherit;
      line-height: 1.6;
      resize: vertical
    }

    input[type="text"]:focus,
    input[type="number"]:focus,
    textarea:focus {
      outline: none;
      border-color: #f59e0b;
      box-shadow: 0 0 0 2px rgba(245, 158, 11, .2)
    }

    input::placeholder,
    textarea::placeholder {
      color: #71717a
    }

    .b {
      border: none;
      border-radius: 8px;
      padding: 13px 26px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: transform .1s, background-color .15s
    }

    .b:active {
      transform: scale(.97)
    }

    .bp {
      background: linear-gradient(135deg, #d97706, #f59e0b);
      color: #09090b
    }

    .bd {
      background: rgba(255, 143, 112, .15);
      color: #ff8f70;
      border: 1px solid rgba(255, 143, 112, .35)
    }

    .bb {
      background: rgba(255, 255, 255, .04);
      color: #d1d5db;
      border: 1px solid #2e364f;
      padding: 11px 20px;
      font-size: 13px
    }

    .bg {
      background: none;
      border: none;
      color: #9ca3af;
      font-size: 13px;
      cursor: pointer;
      padding: 6px 0;
      font-family: inherit
    }

    .bg:hover {
      color: #f3f4f6
    }

    .bx {
      background: #181824;
      color: #52525b;
      cursor: not-allowed
    }

    .bs {
      padding: 10px 18px;
      font-size: 13px;
      border-radius: 6px
    }

    .br {
      background: #ef4444;
      color: #fff
    }

    .bw {
      width: 100%;
      text-align: center;
      padding: 15px
    }

    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 32px;
      gap: 12px;
      flex-wrap: wrap
    }

    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center
    }

    .ir {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px
    }

    .inum {
      font-size: 13px;
      font-weight: 600;
      color: #9ca3af;
      min-width: 18px;
      text-align: right
    }

    .c {
      padding: 18px;
      border-radius: 10px;
      margin-bottom: 12px
    }

    .cr {
      background: rgba(239, 68, 68, .08);
      border: 1px solid rgba(239, 68, 68, .25)
    }

    .cg {
      background: rgba(74, 222, 128, .08);
      border: 1px solid rgba(74, 222, 128, .25)
    }

    .cy {
      background: rgba(245, 158, 11, .08);
      border: 1px solid rgba(245, 158, 11, .25)
    }

    .cd {
      background: rgba(255, 255, 255, .03);
      border: 1px solid #27273a
    }

    .cl {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.3px;
      margin-bottom: 8px
    }

    .clr {
      color: #ff8f70
    }

    .clg {
      color: #4ede80
    }

    .cly {
      color: #fbbf24
    }

    .cq {
      font-family: Georgia, serif;
      font-size: 17px;
      font-style: italic;
      line-height: 1.55
    }

    .pc {
      width: 100%;
      text-align: left;
      background: rgba(255, 255, 255, .03);
      border: 1px solid #27273a;
      border-radius: 12px;
      padding: 18px;
      cursor: pointer;
      font-family: inherit;
      color: inherit;
      transition: border-color .2s, background .2s;
      margin-bottom: 10px
    }

    .pc:hover {
      border-color: #f59e0b;
      background: rgba(245, 158, 11, .05)
    }

    .pc h3 {
      margin-bottom: 3px;
      color: #f9fafb
    }

    .pc p {
      font-size: 13px;
      color: #9ca3af;
      line-height: 1.4
    }

    .ch {
      width: 100%;
      text-align: left;
      background: rgba(255, 255, 255, .03);
      border: 1px solid #27273a;
      border-radius: 10px;
      padding: 12px 16px;
      cursor: pointer;
      font-family: inherit;
      color: inherit;
      margin-bottom: 8px;
      transition: border-color .15s, background .15s
    }

    .ch:hover {
      border-color: #4b5563
    }

    .ch.on {
      background: rgba(245, 158, 11, .12);
      border-color: rgba(245, 158, 11, .45)
    }

    .chl {
      font-size: 14px;
      font-weight: 600;
      color: #f3f4f6
    }

    .chd {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 2px
    }

    .bw-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 0
    }

    .bw-ring {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 1.5px solid rgba(245, 158, 11, .3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px
    }

    .bw-dot {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(245, 158, 11, .4);
      animation: breathK 4.5s ease-in-out infinite
    }

    .bw-txt {
      font-family: Georgia, serif;
      font-size: 18px;
      font-style: italic;
      color: #e5e7eb;
      margin-bottom: 6px
    }

    .nl {
      font-family: Georgia, serif;
      font-size: 17px;
      line-height: 1.75;
      margin-bottom: 20px;
      transition: opacity 1s, color 1s
    }

    .li {
      display: flex;
      gap: 14px;
      padding: 12px 0;
      border-bottom: 1px solid #1f2436;
      align-items: baseline
    }

    .ld {
      font-size: 11px;
      color: #9ca3af;
      min-width: 48px;
      flex-shrink: 0;
      font-weight: 500
    }

    .ln {
      font-size: 14px;
      color: #e5e7eb;
      line-height: 1.5
    }

    .ct {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 14px
    }

    .ct>div {
      flex: 1;
      min-width: 220px
    }

    .sb {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin: 10px 0
    }

    .sd {
      width: 13px;
      height: 13px;
      border-radius: 3px;
      background: #1f2436
    }

    .sd.f {
      background: #f59e0b
    }

    .sd.t {
      background: #4ede80
    }

    .pg {
      height: 6px;
      background: #1f2436;
      border-radius: 3px;
      overflow: hidden;
      margin: 8px 0
    }

    .pf {
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, #d97706, #f59e0b);
      transition: width .6s ease
    }

    .dp-id {
      text-align: center;
      padding: 28px 18px;
      margin: 16px 0;
      border-radius: 12px;
      background: rgba(74, 222, 128, .06);
      border: 1px solid rgba(74, 222, 128, .2)
    }

    .dp-id .cq {
      color: #4ede80;
      font-size: 19px
    }

    .icard {
      border: 1px solid #27273a;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: border-color .2s;
      background: rgba(255, 255, 255, .02)
    }

    .icard:hover {
      border-color: #4b5563
    }

    .icard.needs {
      border-left: 3px solid #f59e0b
    }

    .icard.done {
      border-left: 3px solid #374151;
      opacity: .85
    }

    .rfc {
      background: rgba(245, 158, 11, .06);
      border: 1px solid rgba(245, 158, 11, .2);
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 18px
    }

    @media(max-width:480px) {
      h1 {
        font-size: 28px
      }

      h2 {
        font-size: 22px
      }

      .ct>div {
        min-width: 100%
      }
    }

    /* Manage screen */
    .mg-section {
      margin-bottom: 24px
    }

    .mg-section h3 {
      margin-bottom: 10px
    }

    .mg-editable {
      position: relative
    }

    .mg-editable textarea {
      transition: border-color .2s
    }

    .mg-editable .mg-save {
      display: none;
      margin-top: 8px
    }

    .mg-editable.editing .mg-save {
      display: inline-block
    }

    .habit-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid #1f2436
    }

    .habit-check {
      width: 22px;
      height: 22px;
      border-radius: 5px;
      border: 2px solid #374151;
      background: none;
      cursor: pointer;
      flex-shrink: 0;
      margin-top: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .15s
    }

    .habit-check.checked {
      background: #f59e0b;
      border-color: #f59e0b
    }

    .habit-check.checked::after {
      content: '✓';
      color: #09090b;
      font-size: 13px;
      font-weight: 700
    }

    .habit-text {
      flex: 1
    }

    .habit-name {
      font-size: 14px;
      color: #f3f4f6;
      line-height: 1.4
    }

    .habit-meta {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 3px
    }

    .habit-streak {
      color: #f59e0b;
      font-weight: 600
    }

    .habit-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0
    }

    .mg-add-row {
      display: flex;
      gap: 8px;
      margin-top: 10px
    }

    .mg-add-row input {
      flex: 1
    }

    /* Tug of war meter */
    .tow {
      margin: 16px 0;
      padding: 18px 16px;
      border-radius: 12px;
      background: rgba(255, 255, 255, .03);
      border: 1px solid #27273a
    }

    .tow-bar {
      display: flex;
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
      background: #1f2436;
      margin: 10px 0
    }

    .tow-old {
      background: linear-gradient(90deg, #dc2626, #ff8f70);
      transition: width .8s ease;
      border-radius: 5px 0 0 5px
    }

    .tow-new {
      background: linear-gradient(90deg, #16a34a, #4ede80);
      transition: width .8s ease;
      border-radius: 0 5px 5px 0
    }

    .tow-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      line-height: 1.3
    }

    .tow-old-label {
      color: #ff8f70;
      max-width: 45%;
      text-align: left
    }

    .tow-new-label {
      color: #4ede80;
      max-width: 45%;
      text-align: right
    }

    /* Evidence list items */
    .ev-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #1f2436
    }

    .ev-text {
      flex: 1;
      font-size: 14px;
      color: #e5e7eb;
      line-height: 1.45
    }

    .ev-edit {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid #374151;
      color: #d1d5db;
      font-size: 11px;
      cursor: pointer;
      padding: 4px 9px;
      border-radius: 4px;
      font-family: inherit;
      flex-shrink: 0;
      transition: all .15s;
      margin-right: 4px
    }

    .ev-edit:hover {
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.5);
      background: rgba(245, 158, 11, 0.15)
    }

    .ev-del {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      font-size: 11px;
      cursor: pointer;
      padding: 4px 9px;
      border-radius: 4px;
      font-family: inherit;
      flex-shrink: 0;
      opacity: 0.95;
      transition: all .15s
    }

    .ev-del:hover {
      opacity: 1;
      color: #ff6b6b;
      background: rgba(239, 68, 68, 0.28);
      border-color: rgba(239, 68, 68, 0.6)
    }

    /* Action items */
    .act-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #1f2436
    }

    .act-text {
      flex: 1;
      font-size: 14px;
      color: #e5e7eb;
      line-height: 1.45
    }

    /* Log success */
    .log-success {
      text-align: center;
      padding: 20px;
      animation: fadeIn .4s ease
    }

    .log-success h3 {
      color: #4ede80;
      margin-bottom: 6px
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0
    }

    input[type="number"] {
      -moz-appearance: textfield
    }

    /* Modal styles & mobile responsive improvements */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(10, 14, 26, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      animation: fadeIn .2s ease
    }

    .modal-card {
      background: #121829;
      border: 1px solid #2e364f;
      border-radius: 16px;
      width: 100%;
      max-width: 600px;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 35px rgba(245, 158, 11, 0.12);
      animation: modalSlide .25s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden
    }

    @media (max-width: 640px) {
      .modal-overlay {
        padding: 8px;
        align-items: flex-end
      }
      .modal-card {
        max-height: 92vh;
        border-radius: 20px 20px 12px 12px
      }
    }

    @keyframes modalSlide {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.96)
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1)
      }
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid #1f2436;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(18, 24, 41, 0.95);
      backdrop-filter: blur(4px);
      z-index: 2
    }

    .modal-header h3 {
      font-size: 18px;
      color: #f9fafb;
      font-family: Georgia, serif
    }

    .modal-close {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid #374151;
      color: #d1d5db;
      font-size: 18px;
      line-height: 1;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .15s;
      flex-shrink: 0
    }

    .modal-close:hover {
      background: rgba(239, 68, 68, 0.25);
      border-color: rgba(239, 68, 68, 0.5);
      color: #fca5a5
    }

    .modal-body {
      padding: 16px 22px 24px;
      overflow-y: auto;
      flex: 1
    }

    /* Enhanced Identity Dual Paths Styles */
    .two-paths-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 18px;
    }

    .path-card {
      border-radius: 16px;
      padding: 20px;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .path-red {
      background: linear-gradient(145deg, rgba(239, 68, 68, 0.09), rgba(30, 15, 20, 0.7));
      border: 1px solid rgba(239, 68, 68, 0.35);
      box-shadow: 0 4px 20px rgba(239, 68, 68, 0.1);
    }

    .path-green {
      background: linear-gradient(145deg, rgba(74, 222, 128, 0.09), rgba(15, 30, 22, 0.7));
      border: 1px solid rgba(74, 222, 128, 0.35);
      box-shadow: 0 4px 20px rgba(74, 222, 128, 0.1);
    }

    .path-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.2px;
      padding: 5px 12px;
      border-radius: 20px;
      margin-bottom: 14px;
      text-transform: uppercase;
    }

    .path-badge-red {
      background: rgba(239, 68, 68, 0.18);
      color: #ff8f70;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .path-badge-green {
      background: rgba(74, 222, 128, 0.18);
      color: #4ede80;
      border: 1px solid rgba(74, 222, 128, 0.4);
    }

    .path-section {
      margin-bottom: 14px;
    }

    .path-section:last-child {
      margin-bottom: 0;
    }

    .path-sublabel {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #ff8f70;
      display: block;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .path-sublabel.green {
      color: #4ede80;
    }

    .path-quote-red {
      font-family: Georgia, serif;
      font-size: 19px;
      font-style: italic;
      color: #ffb399;
      line-height: 1.45;
    }

    .path-quote-green {
      font-family: Georgia, serif;
      font-size: 19px;
      font-style: italic;
      color: #4ede80;
      line-height: 1.45;
    }

    .path-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 4px;
    }

    .path-list-item {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      font-size: 13px;
      line-height: 1.45;
    }

    .path-list-item-red {
      color: #f3f4f6;
    }

    .bullet-red {
      color: #ff8f70;
      font-weight: bold;
    }

    .path-list-item-green {
      color: #f3f4f6;
    }

    .bullet-green {
      color: #4ede80;
      font-weight: bold;
    }

    .timeline-box {
      border-radius: 10px;
      padding: 12px 14px;
      margin-top: 10px;
    }

    .timeline-box-red {
      background: rgba(239, 68, 68, 0.08);
      border: 1px dashed rgba(239, 68, 68, 0.35);
    }

    .timeline-box-red-dark {
      background: rgba(180, 40, 40, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .timeline-box-green {
      background: rgba(74, 222, 128, 0.08);
      border: 1px solid rgba(74, 222, 128, 0.25);
    }

    .timeline-header {

<body>
  <div id="app"></div>
  <script>
    // ═══════════════════════════════════════════════
    // CONSTANTS
    // ═══════════════════════════════════════════════
    const SK = "cage-v3";
    const PATHS = {
      habit: { title: "I have a habit I can't quit", desc: "Smoking, scrolling, junk food, staying up late — something you keep doing despite knowing it hurts.", ph: ["e.g., Smoking even when I hate it afterwards", "e.g., Doom scrolling that steals my sleep", "e.g., Junk food whenever I'm stressed"], av: "that habit you listed — you never stopped. It became so normal you forgot it was a choice.", ck: 'e.g., "Tonight when the craving hits, I\'ll walk for 5 minutes instead — just once."' },
      avoidance: { title: "I keep putting off something important", desc: "A startup, a career move, a creative project — something that matters but always waits for 'tomorrow.'", ph: ["e.g., Avoiding working on my startup/project", "e.g., Saying 'I\'ll start Monday' every week", "e.g., Planning endlessly instead of actually doing"], av: "that thing you kept saying 'tomorrow' about — it's still untouched. 10 years of tomorrows became never.", ck: 'e.g., "Tonight I\'ll open my project and do 30 minutes of real work — not research, building."' },
      stuck: { title: "I feel stuck and don't know why", desc: "Life looks fine from outside but feels empty inside. Same routine, no growth, quiet frustration.", ph: ["e.g., Going through motions without any purpose", "e.g., Comparing my life to others and feeling behind", "e.g., Choosing comfort over anything that might change things"], av: "nothing changed. The routine you felt trapped in at 28 is the same at 43 — just bigger bills, fewer options.", ck: 'e.g., "Tonight I\'ll write what I actually want my life to look like — honestly, 20 minutes."' }
    };
    const FEELINGS = [
      { id: "safety", l: "Safety", d: "They protect me from the risk of failing" },
      { id: "familiarity", l: "Familiarity", d: "They keep me inside what I already know" },
      { id: "comfort", l: "Comfort", d: "They give me instant relief or pleasure" },
      { id: "avoidance", l: "Avoidance", d: "They help me escape hard work or discomfort" },
      { id: "belonging", l: "Belonging", d: "They keep me fitting in with what others expect" }
    ];
    const PROMPTS = [
      "What's one moment today where the old pattern tried to take over? What did you choose instead?",
      "What small thing did you do today that proves the new you is real?",
      "When did you catch yourself defaulting to the old way? What happened next?",
      "What would the old you have done today that the new you refused?",
      "What's something you did today, even tiny, that you're proud of?",
      "When did the new identity feel natural today — not forced?",
      "What decision did you make today that the old you would have avoided?",
      "What discomfort did you sit with today instead of running from it?",
      "What evidence would you show someone to prove you're changing?",
      "Did the old identity whisper anything today? What did you tell it back?",
      "What's one thing that felt easier today than it did a week ago?",
      "How did you push beyond your comfort zone today?",
      "What bigger action did you take today that old-you couldn't have?",

      "If you could message yourself from 30 days ago, what would you say?",
      "What proof did you create today that the cage is breaking?",
      "What risk did you take today — even a small one?",
      "What pattern did you break today?",
      "How did the new you show up in a conversation or decision today?"
    ];

    function getEvidencePoints(id) {
      if (!id || !id.logs) return 0;
      return id.logs.reduce(function (sum, l) {
        var w = l.weight || 'medium';
        if (w === 'fine') return sum + 1;
        if (w === 'strong') return sum + 4; // Significant growth!
        return sum + 2; // medium
      }, 0);
    }

    function getStage(n) {
      var pts = (typeof n === 'object') ? getEvidencePoints(n) : (parseInt(n) || 0);
      if (pts === 0) return { name: "Declared", desc: "Just words for now. Start creating proof.", pct: 3 };
      if (pts <= 6) return { name: "Fragile", desc: "First cracks are forming. Keep going.", pct: 8 };
      if (pts <= 15) return { name: "Taking Root", desc: "Patterns are starting to form.", pct: 20 };
      if (pts <= 28) return { name: "Building", desc: "The old cage is weakening.", pct: 38 };
      if (pts <= 45) return { name: "Solidifying", desc: "Your new identity is becoming real.", pct: 52 };
      if (pts <= 65) return { name: "Strong", desc: "This is starting to feel like who you are.", pct: 67 };
      if (pts <= 120) return { name: "Rooted", desc: "The old identity is losing its grip.", pct: 82 };
      if (pts <= 180) return { name: "Natural", desc: "This isn't effort anymore. It's you.", pct: 93 };
      return { name: "Unshakeable", desc: "The cage is gone.", pct: 100 };
    }

    function renderWeightBadge(w) {
      w = w || 'medium';
      if (w === 'strong') {
        return '<span style="font-size:10px;font-weight:700;background:rgba(74,222,128,0.2);color:#4ede80;border:1px solid rgba(74,222,128,0.4);padding:3px 8px;border-radius:4px;white-space:nowrap;margin-right:6px" title="Significant Growth (+4 points)">🔥 STRONG +4</span>';
      }
      if (w === 'fine') {
        return '<span style="font-size:10px;font-weight:600;background:rgba(255,255,255,0.08);color:#d1d5db;border:1px solid rgba(255,255,255,0.2);padding:3px 8px;border-radius:4px;white-space:nowrap;margin-right:6px" title="Fine step (+1 point)">🌱 Fine +1</span>';
      }
      return '<span style="font-size:10px;font-weight:700;background:rgba(245,158,11,0.2);color:#fbbf24;border:1px solid rgba(245,158,11,0.45);padding:3px 8px;border-radius:4px;white-space:nowrap;margin-right:6px" title="Medium proof (+2 points)">⚡ Medium +2</span>';
    }

    function renderWeightSelector(prefix) {
      return '<div style="margin-bottom:12px">'
        + '<div class="sm" style="margin-bottom:6px;color:#e5e7eb;font-weight:600">Select Impact (Weight):</div>'
        + '<div id="' + prefix + '-wgroup" style="display:flex;gap:6px;flex-wrap:wrap">'
        + '<button type="button" class="b bs bb ' + prefix + '-wbtn" style="flex:1;min-width:80px;font-size:12px;padding:8px 4px" onclick="setWeightSel(\'' + prefix + '\',\'fine\')">🌱 Fine (+1)</button>'
        + '<button type="button" class="b bs bp ' + prefix + '-wbtn" style="flex:1;min-width:80px;font-size:12px;padding:8px 4px" onclick="setWeightSel(\'' + prefix + '\',\'medium\')">⚡ Medium (+2)</button>'
        + '<button type="button" class="b bs bb ' + prefix + '-wbtn" style="flex:1;min-width:140px;font-size:12px;padding:8px 4px;color:#4ede80;border-color:rgba(74,222,128,0.5)" onclick="setWeightSel(\'' + prefix + '\',\'strong\')">🔥 Strong (+4 Growth)</button>'
        + '</div>'
        + '<input type="hidden" id="' + prefix + '-weight" value="medium"/>'
        + '</div>';
    }

    window.setWeightSel = function (prefix, w) {
      var hidden = $('#' + prefix + '-weight');
      if (hidden) hidden.value = w;
      var btns = document.querySelectorAll('.' + prefix + '-wbtn');
      if (btns && btns.length === 3) {
        btns[0].className = 'b bs ' + prefix + '-wbtn ' + (w === 'fine' ? 'bp' : 'bb');
        btns[1].className = 'b bs ' + prefix + '-wbtn ' + (w === 'medium' ? 'bp' : 'bb');
        btns[2].className = 'b bs ' + prefix + '-wbtn ' + (w === 'strong' ? 'bp' : 'bb');
        if (w === 'strong') {
          btns[2].style.background = 'rgba(74,222,128,0.2)';
          btns[2].style.color = '#4ede80';
        } else {
          btns[2].style.background = '';
          btns[2].style.color = '#4ede80';
        }
      }
    };

    // ═══════════════════════════════════════════════
    // STATE
    // ═══════════════════════════════════════════════
    const DEF = { screen: "welcome", identities: [], creating: null, currentId: null, deletedIds: [] };
    let S = load();

    function sanitizeIdentity(id) {
      if (!id || typeof id !== 'object') return null;
      return {
        ...id,
        logs: Array.isArray(id.logs) ? id.logs : [],
        reflections: Array.isArray(id.reflections) ? id.reflections : [],
        habits: Array.isArray(id.habits) ? id.habits : []
      };
    }

    function load() {
      try {
        setTimeout(function () { pullFromCloud(); }, 300);
        let r = localStorage.getItem(SK);
        if (!r) r = localStorage.getItem(SK + '_backup');
        if (r) {
          const p = JSON.parse(r);
          const res = { ...DEF, ...p };
          if (Array.isArray(res.identities)) {
            res.identities = res.identities.map(sanitizeIdentity).filter(Boolean);
          } else {
            res.identities = [];
          }
          return res;
        }
      } catch (e) { }
      return { ...DEF };
    }
    function save() {
      try {
        S._updatedAt = Date.now();
        const data = JSON.stringify(S);
        localStorage.setItem(SK, data);
        localStorage.setItem(SK + '_backup', data);
        pushToCloud();
      } catch (e) { }
    }
    function go(scr) { clearTimers(); S.screen = scr; save(); window.scrollTo(0, 0); render() }
    function cur() {
      const ids = Array.isArray(S.identities) ? S.identities : [];
      const found = ids.find(i => i && i.id === S.currentId);
      return found ? sanitizeIdentity(found) : null;
    }

    function render() {
      const a = $('#app');
      if (!a) return;
      const scr = S.screen;
      if (scr === 'welcome') return rWelcome(a);
      if (scr === 'hub') return rHub(a);
      if (scr.startsWith('create-')) return rCreate(a, scr);
      if (scr === 'identity') return rIdentity(a);
      if (scr === 'practice') return rPractice(a);
      if (scr === 'reflect') return rReflect(a);
      if (scr === 'history') return rHistory(a);
      if (scr === 'manage') return rManage(a);
      if (scr === 'quick-create') return rQuickCreate(a);
      if (scr === 'quick') return rQuick(a);
      if (scr === 'goal') return rGoal(a);
      rWelcome(a);
    }
    window.render = render;

    // ═══════════════════════════════════════════════
    // PERMANENT LIVE CLOUD STORAGE ENGINE (ADDITIVE UNION MERGE + TOMBSTONES)
    // ═══════════════════════════════════════════════
    const CLOUD_URL = 'https://jsonblob.com/api/jsonBlob/019fb278-c045-7f04-b337-ddd5f9eeb9d2';
    var syncTimeout = null;

    function mergeSingleIdentity(i1, i2) {
      if (!i1) return i2;
      if (!i2) return i1;

      const logsMap = new Map();
      [...(i1.logs || []), ...(i2.logs || [])].forEach(l => {
        if (!l) return;
        const key = (l.date || '') + '_' + (l.note || '');
        logsMap.set(key, l);
      });
      const mergedLogs = Array.from(logsMap.values()).sort((a, b) => new Date(a.date || 0) - new Date(b.date || 0));

      const habitsMap = new Map();
      [...(i1.habits || []), ...(i2.habits || [])].forEach(h => {
        if (!h) return;
        const key = h.text || '';
        if (!habitsMap.has(key)) {
          habitsMap.set(key, { ...h, checks: Array.isArray(h.checks) ? [...h.checks] : [] });
        } else {
          const existing = habitsMap.get(key);
          const combinedChecks = [...new Set([...(existing.checks || []), ...(h.checks || [])])];
          habitsMap.set(key, { ...existing, ...h, checks: combinedChecks });
        }
      });
      const mergedHabits = Array.from(habitsMap.values());

      const refMap = new Map();
      [...(i1.reflections || []), ...(i2.reflections || [])].forEach(r => {
        if (!r) return;
        const key = r.date || JSON.stringify(r);
        refMap.set(key, r);
      });
      const mergedReflections = Array.from(refMap.values());

      const mergedOldEvidence = [...new Set([...(i1.oldEvidence || []), ...(i2.oldEvidence || [])])];
      const mergedActions = [...new Set([...(i1.actions || []), ...(i2.actions || [])])];

      return {
        ...i2,
        ...i1,
        logs: mergedLogs,
        habits: mergedHabits,
        reflections: mergedReflections,
        oldEvidence: mergedOldEvidence,
        actions: mergedActions
      };
    }

    function mergeStates(loc, cld) {
      if (!cld) return loc;
      
      const locDel = Array.isArray(loc && loc.deletedIds) ? loc.deletedIds : [];
      const cldDel = Array.isArray(cld && cld.deletedIds) ? cld.deletedIds : [];
      const allDeleted = [...new Set([...locDel, ...cldDel])];

      const locIds = (loc && Array.isArray(loc.identities) ? loc.identities : [])
        .map(sanitizeIdentity)
        .filter(i => i && i.id && !allDeleted.includes(i.id));

      const cldIds = (cld && Array.isArray(cld.identities) ? cld.identities : [])
        .map(sanitizeIdentity)
        .filter(i => i && i.id && !allDeleted.includes(i.id));

      if (cldIds.length === 0 && locIds.length > 0) {
        pushToCloud();
        return { ...DEF, ...loc, identities: locIds, deletedIds: allDeleted };
      }
      if (locIds.length === 0 && cldIds.length > 0) {
        return { ...DEF, ...cld, identities: cldIds, deletedIds: allDeleted };
      }

      const map = new Map();
      locIds.forEach(i => map.set(i.id, i));
      cldIds.forEach(i => {
        if (!map.has(i.id)) {
          map.set(i.id, i);
        } else {
          const existing = map.get(i.id);
          const merged = mergeSingleIdentity(existing, i);
          map.set(i.id, merged);
        }
      });

      const mergedList = Array.from(map.values());
      const resScr = (loc.screen && loc.screen !== 'welcome') ? loc.screen : (cld.screen || 'hub');
      const resId = loc.currentId || cld.currentId || (mergedList.length > 0 ? mergedList[0].id : null);
      return { ...DEF, ...cld, ...loc, identities: mergedList, deletedIds: allDeleted, screen: resScr, currentId: resId };
    }

    function triggerCloudAutoSync() {
      if (!S) return;
      clearTimeout(syncTimeout);
      syncTimeout = setTimeout(function () {
        pushToCloud();
      }, 600);
    }

    window.pushToCloud = async function () {
      try {
        await fetch(CLOUD_URL, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify(S)
        });
        return true;
      } catch (e) {
        console.warn('Cloud push error:', e);
        return false;
      }
    };

    window.pullFromCloud = async function () {
      try {
        var res = await fetch(CLOUD_URL, {
          headers: { 'Accept': 'application/json' }
        });
        if (!res.ok) return false;
        var parsed = await res.json();
        if (parsed) {
          S = mergeStates(S, parsed);
          if (S.identities && S.identities.length > 0 && S.screen === 'welcome') {
            S.screen = 'hub';
          }
          localStorage.setItem(SK, JSON.stringify(S));
          render();
          return true;
        }
      } catch (e) {
        console.warn('Cloud pull error:', e);
      }
      return false;
    };

    window.exportDataJSON = function () {
      var dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(S, null, 2));
      var downloadAnchor = document.createElement('a');
      var filename = 'cage-breaker-backup-' + today() + '.json';
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", filename);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    };

    window.triggerImportJSON = function () {
      var fileInp = $('#json-file-input');
      if (fileInp) fileInp.click();
    };

    window.importDataJSONFile = function (evt) {
      var file = evt.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function (e) {
        try {
          var imported = JSON.parse(e.target.result);
          if (imported && (imported.identities || imported.screen)) {
            S = { ...DEF, ...imported };
            save();
            render();
            alert('✓ Successfully imported backup! ' + (S.identities ? S.identities.length : 0) + ' identities loaded.');
          } else {
            alert('Invalid backup file format.');
          }
        } catch (err) {
          alert('Error reading JSON file: ' + err.message);
        }
      };
      reader.readAsText(file);
    };

    window.copySyncCode = function () {
      var inp = $('#my-sync-code');
      if (inp) {
        inp.select();
        navigator.clipboard.writeText(inp.value);
        var statusEl = $('#sync-status-msg');
        if (statusEl) statusEl.textContent = '✓ Sync code copied to clipboard!';
      }
    };

    // ═══════════════════════════════════════════════
    // TIMERS
    // ═══════════════════════════════════════════════
    let TT = [];
    function clearTimers() { TT.forEach(t => clearTimeout(t)); TT = [] }
    function addT(fn, ms) { TT.push(setTimeout(fn, ms)) }

    // ═══════════════════════════════════════════════
    // HELPERS
    // ═══════════════════════════════════════════════
    const $ = s => document.querySelector(s);
    const e = s => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML };
    const today = () => new Date().toISOString().split('T')[0];
    function daysBetween(d1, d2) { return Math.max(0, Math.floor((new Date(d2) - new Date(d1)) / 864e5)) }
    function daysOld(id) { return daysBetween(id.createdDate, new Date().toISOString()) + 1 }
    function loggedToday(id) {
      if (!id || !id.logs) return false;
      return id.logs.some(l => l && l.date && l.date.split('T')[0] === today());
    }
    function needsReflection(id) {
      if (!id) return false;
      if (daysOld(id) < 7) return false;

        if (isNaN(logDateObj.getTime())) return false;
        var logDateStr = getLocalYYYYMMDD(logDateObj);

        if (state.preset === 'today') return logDateStr === todayStr;

        if (state.preset === '7days') {
          var logDateTime = new Date(logDateStr + 'T00:00:00').getTime();
          var diffDays = (todayTime - logDateTime) / (1000 * 60 * 60 * 24);

          return diffDays >= 0 && diffDays <= 30;
        }

        return true;

    // ═══════════════════════════════════════════════
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeEvidenceModal();
        return;
      }
      if (e.key === 'Enter') {
        const target = e.target;
        if (!target) return;
        const tag = target.tagName;
        if (tag !== 'INPUT' && tag !== 'TEXTAREA') return;

        // For multi-line textareas (rows >= 4 or paragraph fields), allow regular Enter for newlines unless Ctrl/Cmd+Enter is used
        const isLongTextarea = tag === 'TEXTAREA' && (
          target.rows >= 4 ||
          ['avt', 'ni-dayvision', 'qh-vision', 'qh-anti', 'mg-gv', 'mg-av', 'rq1', 'rq2', 'rq3', 'gv'].includes(target.id)
        );

        if (isLongTextarea && !e.ctrlKey && !e.metaKey) return;
        if (tag === 'TEXTAREA' && e.shiftKey) return;

        // 1. Step 1 behavior inputs (#blist)
        if (target.closest && target.closest('#blist')) {
          e.preventDefault();
          const inputs = Array.from(document.querySelectorAll('#blist input'));
          const idx = inputs.indexOf(target);
          if (idx >= 0 && idx < inputs.length - 1) {
            inputs[idx + 1].focus();
          } else {
            const s1btn = document.getElementById('s1n');
            if (s1btn && !s1btn.classList.contains('bx')) {
              s1btn.click();
            }
          }
          return;
        }

        // 2. Quick Habit header inputs navigation
        if (target.id === 'qh-name') {
          e.preventDefault();
          document.getElementById('qh-old')?.focus();
          return;
        }
        if (target.id === 'qh-old') {
          e.preventDefault();
          document.getElementById('qh-ev-input')?.focus();
          return;
        }

        // 3. Direct row sibling button (e.g. Add / Save button next to input)
        const parent = target.parentElement;
        if (parent) {
          const rowBtn = Array.from(parent.querySelectorAll('button')).find(
            b => !b.classList.contains('ev-del') && b !== target
          );
          if (rowBtn) {
            e.preventDefault();
            rowBtn.click();
            return;
          }
        }

        // 4. Section / Card primary action button
        const container = target.closest ? target.closest('.c, .mg-section, .mg-editable, .fade, body') : null;
        if (container) {
          const actionBtn = container.querySelector('button.mg-save, button.bp, button.bs, button.b');

              e.preventDefault();
              actionBtn.click();
              return;
            }
          }
        }
      }
    });

    function getHabitStreak(h) {
      if (!h.checks || !h.checks.length) return 0;
      const days = [...new Set(h.checks.map(c => c.split('T')[0]))].sort().reverse();
      let s = 0, d = new Date();
      for (let i = 0; i < 90; i++) {
        const ds = d.toISOString().split('T')[0];
        if (days.includes(ds)) { s++; d.setDate(d.getDate() - 1) }
        else if (i === 0) { d.setDate(d.getDate() - 1) }
        else break;
      }
      return s;
    }

    window.modalFilterState = {

    function getLocalYYYYMMDD(dObj) {
      if (!dObj || isNaN(dObj.getTime())) return '';
      var y = dObj.getFullYear();
      var m = String(dObj.getMonth() + 1).padStart(2, '0');
      var d = String(dObj.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + d;
    }

    function filterModalLogs(logs) {
      var state = window.modalFilterState;
      if (!logs || !logs.length) return [];

      var todayD = new Date();
      var todayStr = getLocalYYYYMMDD(todayD);
      var todayTime = new Date(todayStr + 'T00:00:00').getTime();

      return logs.map(function (l, i) { return { l: l, realIdx: i }; }).filter(function (item) {
        var l = item.l;
        if (!l) return false;

        // Search Text
        if (state.searchQuery) {
          var q = state.searchQuery.trim().toLowerCase();
          var noteText = (l.note || '').toLowerCase();
          if (!noteText.includes(q)) return false;
        }

        // Date Filter Preset
        if (state.preset === 'all') return true;

        if (!l.date) return false;
        var logDateObj = new Date(l.date);
        if (isNaN(logDateObj.getTime())) return false;
        var logDateStr = getLocalYYYYMMDD(logDateObj);

        if (state.preset === 'today') {
          return logDateStr === todayStr;
        }

        if (state.preset === '7days') {
          var logDateTime = new Date(logDateStr + 'T00:00:00').getTime();
          var diffDays = (todayTime - logDateTime) / (1000 * 60 * 60 * 24);
          return diffDays >= 0 && diffDays <= 7;
        }

        if (state.preset === '30days') {
          var logDateTime = new Date(logDateStr + 'T00:00:00').getTime();
          var diffDays = (todayTime - logDateTime) / (1000 * 60 * 60 * 24);
          return diffDays >= 0 && diffDays <= 30;
        }

        if (state.preset === 'custom') {
          if (state.startDate && logDateStr < state.startDate) return false;
          if (state.endDate && logDateStr > state.endDate) return false;
          return true;
        }

        return true;
      });
    }

    // ═══════════════════════════════════════════════
    // TUG OF WAR VISUAL
    // ═══════════════════════════════════════════════
    function renderTugOfWar(id) {
      var logs = getEvidencePoints(id);
      var entryCount = id.logs ? id.logs.length : 0;

      var lvlNames = ['Seed', 'Sprout', 'Sapling', 'Young Tree', 'Strong Tree', 'Deep Roots', 'Mighty Oak', 'Ancient', 'Legendary', 'Mythic', 'Eternal', 'Transcendent', 'Infinite'];
      var oldNames = ['Dominant', 'Rooted', 'Holding', 'Shaking', 'Cracking', 'Crumbling', 'Fading', 'Broken', 'Dust', 'Gone'];

      // DYNAMIC LEVEL PROGRESSION: Each level has its OWN target points needed
      // Level 0: 4 pts (25% per pt) | Level 1: 6 pts (16.7% per pt) | Level 2: 8 pts (12.5% per pt)
      // Level 3: 10 pts (10% per pt) | Level 4: 14 pts (7.1% per pt) | Level 5: 18 pts (5.6% per pt)...
      var levelReqs = [4, 6, 8, 10, 14, 18, 24, 30, 40, 50, 60, 75, 100];

      function getLevelInfo(total) {
        var lvl = 0, used = 0;
        while (lvl < levelReqs.length) {
          var req = levelReqs[lvl];
          if (used + req > total) {
            return {
              level: lvl,
              progress: total - used,
              needed: req,
              total: total
            };
          }
          used += req;
          lvl++;
        }
        var lastReq = levelReqs[levelReqs.length - 1];
        return {
          level: levelReqs.length - 1,
          progress: (total - used) % lastReq,
          needed: lastReq,
          total: total
        };
      }

      var nLvl = getLevelInfo(logs);
      var nPct = Math.min(100, Math.round((nLvl.progress / nLvl.needed) * 100));
      var nName = lvlNames[Math.min(nLvl.level, lvlNames.length - 1)];

      // Old identity: loses levels as proof points increase
      var oLevelRaw = Math.max(0, 5 - Math.floor(logs / 10));
      var oWithinLevel = logs % 10;
      var oPct = Math.max(0, Math.round(100 - (oWithinLevel / 10) * 100));
      if (oLevelRaw === 0) oPct = Math.max(0, Math.round(100 - (logs / 50) * 100));
      var oName = oldNames[Math.min(5 - oLevelRaw, oldNames.length - 1)];
      if (logs >= 50) oName = oldNames[oldNames.length - 1];

      // Build the level-up bar SVG (ensures visible minimum fill chunk per point)
      function makeBar(pct, color, glowColor, direction) {
        var w = Math.max(pct > 0 ? 12 : 0, Math.round(pct * 2.2)); // visible fill chunk
        return '<svg viewBox="0 0 220 28" width="100%" height="28" style="display:block">'
          + '<rect x="0" y="4" width="220" height="20" rx="10" fill="#0e1220"/>'
          + '<rect x="' + (direction === 'rtl' ? 220 - w : 0) + '" y="4" width="' + w + '" height="20" rx="10" fill="' + color + '"'
          + ' style="filter:drop-shadow(0 0 ' + (pct > 50 ? '8' : '4') + 'px ' + glowColor + ');transition:width 0.4s ease"/>'
          + '</svg>';
      }

      function makePips(count, max, color) {
        var h = '<div style="display:flex;gap:4px;justify-content:center;margin-top:6px">';
        for (var p = 0; p < max; p++) {
          h += '<div style="width:8px;height:8px;border-radius:50%;background:' + (p < count ? color : '#27273a') + ';transition:background 0.3s"></div>';
        }
        h += '</div>';
        return h;
      }

      return '<div class="tow" style="padding:18px 14px">'
        + '<div style="display:flex;gap:20px">'

        // OLD IDENTITY
        + '<div style="flex:1">'
        + '<p style="font-size:11px;color:#ff8f70;font-weight:700;letter-spacing:1px;margin-bottom:4px">OLD IDENTITY</p>'
        + '<div style="display:flex;align-items:baseline;gap:6px;margin-bottom:6px">'
        + '<span style="font-size:20px;font-weight:700;color:#ff7a59;font-family:Georgia,serif">Lv.' + oLevelRaw + '</span>'
        + '<span style="font-size:12px;color:#fca5a5;font-weight:600">' + oName + '</span>'
        + '</div>'
        + makeBar(oPct, '#dc2626', '#7f1d1d', 'rtl')
        + '<p style="font-size:11px;color:#d1d5db;margin-top:4px">' + oPct + '% remaining</p>'
        + makePips(oLevelRaw, 5, '#ef4444')
        + '</div>'

        // NEW IDENTITY
        + '<div style="flex:1">'
        + '<p style="font-size:11px;color:#4ede80;font-weight:700;letter-spacing:1px;margin-bottom:4px">NEW IDENTITY</p>'
        + '<div style="display:flex;align-items:baseline;gap:6px;margin-bottom:6px">'
        + '<span style="font-size:20px;font-weight:700;color:#4ede80;font-family:Georgia,serif">Lv.' + nLvl.level + '</span>'
        + '<span style="font-size:12px;color:#86efac;font-weight:600">' + nName + '</span>'
        + '</div>'
        + makeBar(nPct, '#22c55e', '#14532d', 'ltr')
        + '<p style="font-size:11px;color:#d1d5db;margin-top:4px">' + nLvl.progress + '/' + nLvl.needed + ' pts (' + nPct + '% filled)</p>'
        + makePips(nLvl.level, Math.max(5, nLvl.level + 2), '#22c55e')
        + '</div>'

        + '</div>'

        + '<p style="font-size:12px;color:#cbd5e1;text-align:center;margin-top:14px;font-style:italic">'
        + (entryCount === 0 ? 'Add your first proof to begin leveling up'
          : nPct >= 80 ? 'Almost there — ' + (nLvl.needed - nLvl.progress) + ' more pts to Level Up!'
            : nLvl.level === 0 ? 'Building momentum — ' + nLvl.progress + ' of ' + nLvl.needed + ' pts to Level 1'
              : 'Level ' + nLvl.level + ' ' + nName + ' — ' + nLvl.progress + ' of ' + nLvl.needed + ' pts to Lv.' + (nLvl.level + 1) + ' (' + logs + ' total pts)')
        + '</p>'
        + '</div>';
    }

      if (l5) l5.textContent = '5. A Day in Your Life: How will your day look after ' + num + ' days of continuing this habit?';
      var vis = $('#qh-vision');
      if (vis) vis.placeholder = 'Describe your day from morning to night after ' + num + ' days of this habit…';
      var btnSub = $('#qh-submit-btn');
      if (btnSub) btnSub.textContent = 'Start my ' + num + '-day journey';
    };
    function qhSaveFields() {
      if (!S._qh) S._qh = { name: '', oldIdentity: '', oldEvidence: [], days: 30, vision: '', antiVision: '', actions: [] };
      var q = S._qh;
      q.name = $('#qh-name')?.value || q.name;
      q.oldIdentity = $('#qh-old')?.value || q.oldIdentity;
      q.vision = $('#qh-vision')?.value || q.vision;
      q.antiVision = $('#qh-anti')?.value || q.antiVision;
      save();
    }



    // ═══════════════════════════════════════════════
    // QUICK ADD EVIDENCE
    // ═══════════════════════════════════════════════
    window.quickPick = function () {
      if (S.identities.length === 1) {
        S.currentId = S.identities[0].id; save(); go('quick');
      } else {
        // Show picker
        go('quick-pick');
      }
    };

    function rQuick(a) {
      var id = cur();
      renderIdentityView(a, id);
    }

    window.quickLog = function () {
      var v = $('#qlog')?.value?.trim();
      if (!v) return;
      var w = $('#qlog-weight')?.value || 'medium';
      var id = cur(); if (!id) return;
      id.logs.push({ date: new Date().toISOString(), note: v, weight: w });
      save();
      var pts = getEvidencePoints(id);
      var stage = getStage(pts);
      var ta = $('#qlog');
      var btn = ta?.parentElement?.querySelector('.b');
      if (ta) ta.value = '';
      if (btn) {
        var isStrong = (w === 'strong');
        btn.textContent = isStrong ? '🔥 Significant Growth! +4 Points Added!' : (w === 'fine' ? '🌱 Fine Step +1 Point Added!' : '✓ Proof +2 Points Added!');
        btn.style.background = isStrong ? '#3a7e4a' : '#3a6e4a';
        setTimeout(function () {
          btn.textContent = 'Add proof';
          btn.style.background = '';
          render();
        }, 1500);
      }
    };


    // ═══════════════════════════════════════════════
    // GOAL PROJECTION
    // ═══════════════════════════════════════════════
    function renderGoalCard(id) {
      if (!id.goalDays && !id.goalVision) return '<div class="c cy" style="text-align:center;padding:16px;margin-top:16px"><p class="d" style="margin-bottom:8px">Envision how your day will look after continuing this habit for 30 days.</p><button class="b bp bs" onclick="go(\'goal\')">Write your day vision</button></div>';

      var days = id.goalDays || 30;
      var elapsed = daysBetween(id.goalSetDate || id.createdDate, new Date().toISOString());
      var remaining = Math.max(0, days - elapsed);
      var progress = Math.min(100, Math.round(elapsed / days * 100));

      return '<div class="c cy" style="margin-top:16px">'
        + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">'
        + '<div class="cl cly">A DAY IN YOUR LIFE \u2014 ' + days + ' DAY JOURNEY</div>'
        + '<button class="bg" onclick="go(\'goal\')" style="font-size:11px;color:#d4a04a">Edit</button>'
        + '</div>'
        + '<div style="display:flex;gap:16px;margin-bottom:12px">'
        + '<div style="text-align:center"><div style="font-size:22px;font-weight:700;color:#d4a04a;font-family:Georgia,serif">' + remaining + '</div><div style="font-size:10px;color:#6e6862">days left</div></div>'
        + '<div style="text-align:center"><div style="font-size:22px;font-weight:700;color:#6abf7b;font-family:Georgia,serif">' + elapsed + '</div><div style="font-size:10px;color:#6e6862">days in</div></div>'
        + '<div style="text-align:center"><div style="font-size:22px;font-weight:700;color:#d4a04a;font-family:Georgia,serif">' + progress + '%</div><div style="font-size:10px;color:#6e6862">complete</div></div>'
        + '</div>'
        + '<div style="height:6px;background:#141420;border-radius:3px;overflow:hidden;margin-bottom:12px"><div style="height:100%;width:' + progress + '%;background:linear-gradient(90deg,#b8862e,#d4a04a);border-radius:3px;transition:width .5s"></div></div>'
        + '<div style="margin-bottom:10px"><p style="font-size:12px;color:#6e6862;margin-bottom:4px;font-weight:600">HOW MY DAY LOOKS (written by me):</p><p style="font-size:13px;color:#a09890;line-height:1.65;font-style:italic;white-space:pre-wrap">\u201c' + e(id.goalVision || 'No day vision written yet.') + '\u201d</p></div>'
        + (id.goalActions && id.goalActions.length > 0 ?
          '<div><p style="font-size:12px;color:#6e6862;margin-bottom:4px;font-weight:600">IMMEDIATE ACTIONS:</p>'
          + id.goalActions.map(function (ac, i) { return '<div style="display:flex;gap:8px;padding:3px 0"><span style="color:#d4a04a;font-size:12px">\u25b8</span><span style="font-size:13px;color:#a09890;line-height:1.4">' + e(ac) + '</span></div>' }).join('')
          + '</div>'
          : '')
        + '</div>';
    }

    function renderGoalCardQuick(id) {
      if (!id.goalDays) return '';
      var elapsed = daysBetween(id.goalSetDate, new Date().toISOString());
      var remaining = Math.max(0, id.goalDays - elapsed);
      var progress = Math.min(100, Math.round(elapsed / id.goalDays * 100));
      return '<div style="margin-top:12px;padding:12px 14px;background:rgba(212,160,74,0.04);border:1px solid rgba(212,160,74,0.1);border-radius:8px">'
        + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">'
        + '<span style="font-size:10px;color:#d4a04a;font-weight:600">' + id.goalDays + '-DAY GOAL</span>'
        + '<span style="font-size:10px;color:#6e6862">Day ' + elapsed + ' of ' + id.goalDays + ' (' + remaining + ' left)</span>'
        + '</div>'
        + '<div style="height:4px;background:#141420;border-radius:2px;overflow:hidden"><div style="height:100%;width:' + progress + '%;background:#d4a04a;border-radius:2px"></div></div>'
        + '<p style="font-size:11px;color:#7a7a70;margin-top:6px;font-style:italic;line-height:1.4">' + e(id.goalVision.length > 80 ? id.goalVision.substring(0, 80) + '\u2026' : id.goalVision) + '</p>'
        + '</div>';
    }

    function rGoal(a) {
      var id = cur(); if (!id) return go('hub');
      var hasGoal = !!id.goalDays;

      a.innerHTML = '<div class="fade">'
        + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">'
        + '<button class="bg" onclick="go(\'identity\')">\u2190 Back</button>'
        + '<button class="bg" onclick="go(\'hub\')" style="color:#d4a04a">Main menu \u2192</button>'
        + '</div>'
        + '<div class="sn">' + (hasGoal ? 'EDIT YOUR GOAL' : 'SET YOUR GOAL') + '</div>'
        + '<h2 style="margin-bottom:14px">Where is this identity taking you?</h2>'
        + '<p class="d">Setting a clear timeline makes the change real. Answer these three questions to create your roadmap.</p>'

        // Q1: Timeline
        + '<div style="margin-top:20px">'
        + '<label class="lb">1. In how many days do you want to see real change?</label>'
        + '<p class="h">Pick a timeframe that feels challenging but realistic. Common choices: 21, 30, 60, or 90 days.</p>'
        + '<div id="gd-preset-btns" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">'
        + '<button type="button" class="b bs ' + (id.goalDays === 21 ? 'bp' : 'bb') + '" onclick="setGD(21)">21 days</button>'
        + '<button type="button" class="b bs ' + (id.goalDays === 30 ? 'bp' : 'bb') + '" onclick="setGD(30)">30 days</button>'
        + '<button type="button" class="b bs ' + (id.goalDays === 60 ? 'bp' : 'bb') + '" onclick="setGD(60)">60 days</button>'
        + '<button type="button" class="b bs ' + (id.goalDays === 90 ? 'bp' : 'bb') + '" onclick="setGD(90)">90 days</button>'
        + '</div>'
        + '<div style="display:flex;gap:8px;align-items:center"><input type="number" id="gd-custom" value="' + (id.goalDays || '') + '" placeholder="Or type custom days" style="width:160px" oninput="setGD(this.value, true)"/><span class="sm">days</span></div>'
        + '</div>'

        // Q2: Vision
        + '<div style="margin-top:24px">'
        + '<label class="lb" id="gd-l2-text">2. A Day in Your Life: How will your day look after ' + (id.goalDays || 'X') + ' days of continuing this habit?</label>'
        + '<p class="h">Describe your day from morning to night. How will your routine, energy, and choices change?</p>'
        + renderStrongExampleCard('gv', id.newIdentity || 'my habit')
        + '<textarea rows="4" id="gv" placeholder="Describe your day from morning to night after this journey\u2026" style="min-height:100px">' + (id.goalVision ? e(id.goalVision) : '') + '</textarea>'
        + '</div>'

        // Q3: Immediate actions
        + '<div style="margin-top:24px">'
        + '<label class="lb">3. What immediate actions can you take RIGHT NOW to move toward this?</label>'
        + '<p class="h">Not someday actions. Things you can start today or this week. Be specific.</p>'
        + '<div class="c cd" style="padding:12px 14px;margin-bottom:10px;font-size:12px;color:#5e5a56;line-height:1.6">'
        + '<strong style="color:#6e6862">Examples:</strong><br>'
        + '\u2022 "Block 7-8pm every day for project work"<br>'
        + '\u2022 "Delete Instagram from my phone today"<br>'
        + '\u2022 "Tell one friend about my goal for accountability"'
        + '</div>'
        + '<div id="ga-list">' + (id.goalActions ? id.goalActions.map(function (ac, i) { return '<div class="ev-item"><span class="ev-text">' + e(ac) + '</span><button class="ev-del" onclick="delGA(' + i + ')">delete</button></div>' }).join('') : '') + '</div>'
        + '<div style="display:flex;gap:8px;margin-top:8px"><input type="text" id="ga-input" placeholder="e.g., Work on my project every evening at 8pm" style="flex:1"/><button class="b bp bs" onclick="addGA()">Add</button></div>'
        + '</div>'

        // Save
        + '<div style="margin-top:28px">'
        + '<button type="button" class="b bp bw" onclick="saveGoal()" id="goal-save">Save my goal</button>'
        + '</div>'

        + '</div>';
    }

    window.setGD = function (d, fromInput) {
      var id = cur(); if (!id) return;
      var num = parseInt(d) || 0;
      id.goalDays = num;
      if (!id.goalSetDate) id.goalSetDate = new Date().toISOString();
      save();
      if (!fromInput) {
        var inp = $('#gd-custom'); if (inp) inp.value = num || '';
      }
      var btns = document.querySelectorAll('#gd-preset-btns button');
      if (btns && btns.length === 4) {
        [21, 30, 60, 90].forEach(function (val, idx) {
          if (btns[idx]) btns[idx].className = 'b bs ' + (num === val ? 'bp' : 'bb');
        });
      }
      var l2 = $('#gd-l2-text');
      if (l2) l2.textContent = '2. A Day in Your Life: How will your day look after ' + (num || 'X') + ' days of continuing this habit?';
    };

    window.addGA = function () {
      var v = $('#ga-input')?.value?.trim(); if (!v) return;
      var id = cur(); if (!id) return;
      if (!id.goalActions) id.goalActions = [];
      id.goalActions.push(v); save(); render();
    };

    window.delGA = function (i) {
      var id = cur(); if (!id || !id.goalActions) return;
      id.goalActions.splice(i, 1); save(); render();
    };

    window.saveGoal = function () {
      var id = cur(); if (!id) return;
      var customDays = parseInt($('#gd-custom')?.value);
      if (customDays) id.goalDays = customDays;
      if (!id.goalDays) id.goalDays = 30;
      var vision = $('#gv')?.value?.trim();
      id.goalVision = vision || id.goalVision || 'Morning: Clear and focused.\nAfternoon: Grounded and consistent.\nEvening: Quiet pride in my progress.';
      if (!id.goalSetDate) id.goalSetDate = new Date().toISOString();
      save();
      go('identity');
    };

  </script>
</body>

</html>
